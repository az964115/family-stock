name: Auto Update Potential Stocks Data

on:
  schedule:
    - cron: '0 22 * * *' # 每天 UTC 22:00 (台灣時間 06:00) 執行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install playwright

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Fetch stock data with Playwright
        run: node fetch-stocks.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add potential-stocks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update potential stocks data" && git push)
