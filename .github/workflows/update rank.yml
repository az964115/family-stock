name: Auto Update Potential Stocks Data

on:
  schedule:
    # 股市開盤時段排程 (可依需求調整 CRON 時間，預設每 30 分鐘或每小時更新)
    - cron: '0 * * * *'
  workflow_dispatch: # 支援手動在 GitHub 頁面點選觸發

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fetch Script
        run: node scripts/fetch-stocks.js

      - name: Commit and Push Updated Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add potential-stocks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update potential stocks data [skip ci]" && git push)