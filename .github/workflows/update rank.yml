name: Auto Update Potential Stocks Data

on:
  schedule:
    - cron: '0 0 * * *' # 每天固定時間執行
  workflow_dispatch: # 支援手動觸發

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install playwright

      - name: Install Playwright Browsers
        run: |
          npx playwright install --with-deps chromium

      - name: Fetch stock data with Playwright
        run: |
          node fetch-stocks.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add potential-stocks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update potential stocks data" && git push)
