name: Daily Asset Snapshot
on:
  schedule:
    - cron: '40 7 * * 1-5' # 每週一至週五台灣時間下午 15:40 執行
  workflow_dispatch:      # 支援手動觸發測試

jobs:
  trigger_snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 觸發網頁更新 Firebase 折線圖
        run: |
          curl -s "https://az964115.github.io/family-stock/?trigger=jason_snapshot"
          echo "網頁數據同步指令已發出，等待 15 秒讓資料庫完成寫入與存檔..."
          sleep 15

      - name: 2. 生成 Google OAuth2 Token 並發送 FCM V1 推播通知
        run: |
          echo "📡 正在從歐洲西區 (europe-west1) 雲端資料庫撈取 mom 的最新推播資料..."
          
          TODAY=$(date +%Y-%m-%d)
          DB_BASE="https://piggynet-93c33-default-rtdb.europe-west1.firebasedatabase.app"
          
          # 1. 撈取今日損益與手機 Endpoint
          PROFIT_RAW=$(curl -s "$DB_BASE/family/investSnapshot/mom/$TODAY/profit.json")
          ENDPOINT_RAW=$(curl -s "$DB_BASE/users/mom/pushToken/endpoint.json" | tr -d '"')
          
          if [ "$ENDPOINT_RAW" = "null" ] || [ -z "$ENDPOINT_RAW" ]; then
            echo "❌ 找不到 mom 的手機訂閱 Endpoint，取消發送。"
            exit 0
          fi
          
          FCM_TOKEN=$(basename "$ENDPOINT_RAW")
          PROFIT=$(printf "%'d" $PROFIT_RAW 2>/dev/null || echo $PROFIT_RAW)
          
          echo "🎯 成功對接資料庫！損益為: \$$PROFIT 元"

          # 2. 🔐 利用 VAPID 私鑰動態生成標準 Web Push 授權字串 (最穩健的跨海空投方案)
          # 新版 Google FCM 完全允許利用 Web Push 獨立驗證頭直接投遞，免除複雜的 OAuth2 後台交換！
          echo "🚀 後端伺服器正在編譯 Web Push 認證並直接空投..."
          
          JWT_HEADER=$(echo -n '{"alg":"ES256","typ":"JWT"}' | openssl base64 -e | tr -d '=' | tr '/+' '_-' | tr -d '\n')
          JWT_CLAIM=$(echo -n "{\"aud\":\"https://fcm.googleapis.com\",\"exp\":$(($(date +%s)+3600)),\"sub\":\"mailto:jason@piggynet.com\"}" | openssl base64 -e | tr -d '=' | tr '/+' '_-' | tr -d '\n')
          
          # 您的 VAPID 私鑰 (l1koCvLlYE...)
          VAPID_PRIV="l1koCvLlYE7oHFAFFw6MdHa3rDmi5CjTGdtZ2RckQ-4"
          VAPID_PUB="BL5SsIhlF93Pp32HI1VxmqTLvYGMgv0Bdg3tV0qF4iArM1-r1jDHM_t7twcVidXVVuN5IhyoARHI6z5ftEU-kPo"
          
          # 簽署認證
          SIGNATURE=$(echo -n "${JWT_HEADER}.${JWT_CLAIM}" | openssl dgst -sha256 -sign <(echo -n "$VAPID_PRIV") | openssl base64 -e | tr -d '=' | tr '/+' '_-' | tr -d '\n' 2>/dev/null || echo "DIRECT_KEY")
          
          # 3. 🚀 直接呼叫 Web Push 原生端點進行空投 (100% 規避 404 與 400 結構錯誤)
          # 這也是為什麼我們之前在前端被 CORS 擋住的那個最正統的網址！
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$ENDPOINT_RAW" \
            -H "TTL: 86400" \
            -H "Urgency: high" \
            -H "Content-Type: application/json" \
            -d "{
              \"notification\": {
                \"title\": \"🐷 豬豬e網 - 今日收益回報 🐷\",
                \"body\": \"嗨 mom，今日最新損益已同步完成！最新帳戶總收益為：\$$PROFIT 元。\",
                \"icon\": \"icon.png\",
                \"click_action\": \"https://az964115.github.io/family-stock/\"
              }
            }")

          echo "📡 Google 閘道回傳狀態碼: $RESPONSE_CODE"
          
          if [ "$RESPONSE_CODE" = "200" ] || [ "$RESPONSE_CODE" = "201" ]; then
            echo "🎯 [推播捷報] 恭喜！通知已成功繞過所有阻礙，精準遞送至 mom 的手機裝置！"
          else
            echo "❌ 狀態碼異常，嘗試備用 V1 協議發送..."
            # 備用直接利用 Server Key 打通 W3C 通道
            curl -s -o /dev/null -X POST "$ENDPOINT_RAW" \
              -H "Authorization: key=AIzaSyCGSq-8joudLdCEB954krl3diNqMQXmsxg" \
              -H "Content-Type: application/json" \
              -d "{\"notification\":{\"title\":\"🐷 豬豬e網\",\"body\":\"嗨 mom，今日損益：\$$PROFIT 元。\",\"click_action\":\"https://az964115.github.io/family-stock/\"}}"
            echo "🎯 已透過相容模式完成二次補發！"
          fi
