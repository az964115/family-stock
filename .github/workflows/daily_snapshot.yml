name: Daily Asset Snapshot
on:
  schedule:
    - cron: '40 7 * * 1-5' # 每週一至週五台灣時間下午 15:40 執行
  workflow_dispatch:      # 支援手動觸發測試

jobs:
  trigger_snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 觸發網頁更新 Firebase 折線圖
        run: |
          curl -s "https://az964115.github.io/family-stock/?trigger=jason_snapshot"
          echo "網頁數據同步指令已發出，等待 15 秒讓資料庫完成寫入與存檔..."
          sleep 15

      - name: 2. 從歐洲資料庫撈取最新損益與標準 Web Push 三件套並發送通知
        run: |
          echo "📡 正在從歐洲西區 (europe-west1) 雲端資料庫撈取 mom 的最新推播資料..."
          
          TODAY=$(date +%Y-%m-%d)
          DB_BASE="https://piggynet-93c33-default-rtdb.europe-west1.firebasedatabase.app"
          
          # 撈取今日損益
          PROFIT_RAW=$(curl -s "$DB_BASE/family/investSnapshot/mom/$TODAY/profit.json")
          
          # 撈取標準 Web Push 的三件套 (Endpoint)
          ENDPOINT_RAW=$(curl -s "$DB_BASE/users/mom/pushToken/endpoint.json" | tr -d '"')
          
          if [ "$ENDPOINT_RAW" = "null" ] || [ -z "$ENDPOINT_RAW" ]; then
            echo "❌ 找不到 mom 的手機訂閱 Endpoint，取消發送。"
            exit 0
          fi
          
          # 從 endpoint 網址中精準切出真正的 FCM Token ID
          FCM_TOKEN=$(basename "$ENDPOINT_RAW")
          
          # 格式化金額數字為千分位
          PROFIT=$(printf "%'d" $PROFIT_RAW 2>/dev/null || echo $PROFIT_RAW)
          
          echo "🎯 成功對接正確的資料庫！"
          echo "💰 今日最新真實損益為: \$$PROFIT 元"
          
          # 💡 修正點：改回打 V1 唯一的通用相容轉發端點，並使用符合 Google 規範的標準 JSON 封包結構
          echo "🚀 後端伺服器正在將通知直接空投至該手機端點..."
          
          SERVER_KEY="AIzaSyCGSq-8joudLdCEB954krl3diNqMQXmsxg"
          
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://fcm.googleapis.com/fcm/send" \
            -H "Content-Type: application/json" \
            -H "Authorization: key=$SERVER_KEY" \
            -d "{
              \"to\": \"$FCM_TOKEN\",
              \"notification\": {
                \"title\": \"🐷 豬豬e網 - 今日收益回報 🐷\",
                \"body\": \"嗨 mom，今日最新損益已同步完成！最新帳戶總收益為：\$$PROFIT 元。\",
                \"icon\": \"icon.png\",
                \"click_action\": \"https://az964115.github.io/family-stock/\"
              }
            }")
            
          echo "📡 Google FCM 閘道回傳狀態碼: $RESPONSE_CODE"
          
          if [ "$RESPONSE_CODE" = "200" ] || [ "$RESPONSE_CODE" = "201" ]; then
            echo "🎯 [推播捷報] 恭喜！通知已成功跨海精準遞送至 mom 的手機裝置！"
          else
            echo "❌ 發送失敗，狀態碼非 200/201，請檢查後台日誌。"
          fi
