name: Daily Asset Snapshot (Email)
on:
  schedule:
    - cron: '0 6 * * 1-5'   # 💡 台灣時間每週一至週五下午 14:00 自動執行 (6 + 8 = 14)
  workflow_dispatch:        # 💡 保留手動點擊發送的按鈕，方便您隨時測試！

jobs:
  send_reports:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出程式碼庫
        uses: actions/checkout@v3

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-node-version: '3.10'

      - name: 3. 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. 執行網頁同步並發送損益通知信
        env:
          GMAIL_USER: "jis964115@gmail.com"
          GMAIL_PASSWORD: "esjc kmhh ibye jxcc"
        run: |
          # 觸發網頁將最新數據存入 Firebase 歐洲資料庫
          curl -s "https://az964115.github.io/family-stock/?trigger=jason_snapshot"
          echo "網頁數據同步指令已發出，等待 15 秒讓資料庫完成寫入與存檔..."
          sleep 15
          
          # 執行我們寫好的 Python 寄信腳本
          python send_family_stock_email.py
