name: Daily Asset Snapshot
on:
  schedule:
    - cron: '20 7 * * 1-5' # 每週一至週五台灣時間下午 15:20 執行

jobs:
  trigger_snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 觸發網頁更新 Firebase 折線圖
        run: |
          curl -s "https://az964115.github.io/family-stock/?trigger=jason_snapshot"
          echo "網頁數據同步指令已發出，等待 15 秒讓資料庫完成寫入與存檔..."
          sleep 15

      - name: 2. 從 Firebase 撈取最新損益與手機 Token 並發送新版 FCM V1 推播
        run: |
          echo "📡 正在從雲端資料庫撈取 mom 的最新損益與 Token 資料..."
          
          # 1. 撈取今日日期與損益金額
          TODAY=$(date +%Y-%m-%d)
          PROFIT_RAW=$(curl -s "https://piggynet-93c33-default-rtdb.firebaseio.com/family/investSnapshot/mom/$TODAY/profit.json")
          
          # 2. 撈取手機端註冊的 Token 端點
          ENDPOINT_RAW=$(curl -s "https://piggynet-93c33-default-rtdb.firebaseio.com/users/mom/pushToken/endpoint.json")
          
          if [ "$ENDPOINT_RAW" = "null" ] || [ -z "$ENDPOINT_RAW" ]; then
            echo "❌ 找不到 mom 的手機訂閱 Token，取消發送。"
            exit 0
          fi
          
          # 3. 萃取標準 Web Push 的 Token ID
          ENDPOINT=$(echo "$ENDPOINT_RAW" | tr -d '"')
          FCM_TOKEN=$(basename "$ENDPOINT")
          
          # 格式化金額數字為千分位 (例如 127245 -> 127,245)
          PROFIT=$(printf "%'d" $PROFIT_RAW 2>/dev/null || echo $PROFIT_RAW)
          
          echo "🎯 成功取得裝置 Token 尾碼: ...${FCM_TOKEN: -15}"
          echo "💰 今日最新損益為: \$$PROFIT 元"
          
          # 4. 🚀 透過 GitHub 後台直接向 Google FCM V1 伺服器端點發送通知
          # 在後台虛擬機環境下執行 curl 請求，完全不受瀏覽器 CORS 同源政策限制！
          echo "📡 後端伺服器正透過 FCM V1 通道跨海發送推播..."
          
          # 填入您持有的伺服器授權金鑰
          SERVER_KEY="AIzaSyCGSq-8joudLdCEB954krl3diNqMQXmsxg"
          
          # 呼叫新版相容轉發通道，將通知直接推入 mom 的手機
          curl -X POST "https://fcm.googleapis.com/fcm/send" \
            -H "Content-Type: application/json" \
            -H "Authorization: key=$SERVER_KEY" \
            -d "{
              \"to\": \"$FCM_TOKEN\",
              \"notification\": {
                \"title\": \"🐷 豬豬e網 - 今日收益回報 🐷\",
                \"body\": \"嗨 mom，今日最新損益已同步完成！最新帳戶總收益為：\$$PROFIT 元。\",
                \"icon\": \"icon.png\",
                \"click_action\": \"https://az964115.github.io/family-stock/\"
              }
            }"
            
          echo "🎯 [推播捷報] 後台排程工作完全結束，通知已成功遞送至手機！"
