name: Update Evening Stock Data

on:
  schedule:
    # 台灣時間 22:00, 23:00, 05:00 (對應 UTC 14:00, 15:00, 21:00)
    - cron: '0 14,15,21 * * *'
    - cron: '20 14 * * *'
    - cron: '40 13 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行

permissions:
  contents: write # 開啟寫入/Push 權限

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape Evening Data & Save JSON
        run: |
          mkdir -p data
          cat << 'EOF' > scrape.py
          import requests
          import json
          import re
          from bs4 import BeautifulSoup

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          }

          # -------------------------------------------------------------
          # 1. 爬取 Yahoo 奇摩股市 - 資券餘額與日期
          # -------------------------------------------------------------
          try:
              print("Scraping Yahoo Margin Balance Page...")
              url_margin = "https://tw.stock.yahoo.com/margin-balance"
              r = requests.get(url_margin, headers=headers, timeout=15)
              soup = BeautifulSoup(r.text, 'html.parser')

              margin_date = "--"
              margin_buy = "統計中"
              margin_sell = "統計中"

              rows = soup.find_all('div', class_=re.compile(r'table-row'))
              
              target_row = None
              for row in rows:
                  date_match = re.search(r'\d{4}/\d{2}/\d{2}', row.get_text())
                  if date_match:
                      target_row = row
                      margin_date = date_match.group(0)
                      break

              if target_row:
                  mend_blocks = target_row.find_all('div', class_=re.compile(r'Mend\(12px\)'))
                  
                  # 解析融資
                  if len(mend_blocks) > 0:
                      buy_span = mend_blocks[0].find('span')
                      if buy_span:
                          val = buy_span.get_text(strip=True)
                          if 'c-trend-up' in str(buy_span) and not val.startswith('+'):
                              val = '+' + val
                          margin_buy = f"{val} 億"

                  # 解析融券
                  if len(mend_blocks) > 1:
                      sell_span = mend_blocks[1].find('span')
                      if sell_span:
                          val = sell_span.get_text(strip=True)
                          if 'c-trend-up' in str(buy_span) and not val.startswith('+'):
                              val = '+' + val
                          margin_sell = f"{val} 張"

              margin_json = [{
                  '日期': margin_date,
                  '融資餘額(張)': margin_buy,
                  '融券餘額(張)': margin_sell
              }]

              with open('data/margin.json', 'w', encoding='utf-8') as f:
                  json.dump(margin_json, f, ensure_ascii=False, indent=2)
              print("✅ Margin data updated successfully:", margin_json)

          except Exception as e:
              print("❌ Scrape Margin error:", e)

          # -------------------------------------------------------------
          # 2. 抓取台指期夜盤數據 (台灣期貨交易所 TAIFEX 官方即時 API)
          # -------------------------------------------------------------
          wtx_data = {
              "price": "--",
              "change": "0.00",
              "changeRate": "0.00%",
              "open": "--",
              "prevClose": "--",
              "high": "--",
              "low": "--",
              "volume": "--"
          }

          try:
              print("Fetching WTX Night Market from TAIFEX Official API...")
              taifex_url = "https://mis.taifex.com.tw/futures/api/getMarketQuoteList"
              payload = {"marketType": "1", "symbolType": "F"} # 夜盤期貨
              
              res = requests.post(taifex_url, json=payload, headers=headers, timeout=10)
              if res.status_code == 200:
                  items = res.json().get("rtData", {}).get("items", [])
                  # 找到台指期近一月 (TX)
                  tx_item = next((x for x in items if x.get("SymbolID", "").startswith("TX")), None)
                  
                  if tx_item:
                      price = float(tx_item.get("CLastPrice", 0) or 0)
                      change = float(tx_item.get("CDiff", 0) or 0)
                      prev_close = float(tx_item.get("CRefPrice", 0) or 1)
                      rate = (change / prev_close) * 100 if prev_close else 0

                      wtx_data = {
                          "price": f"{price:,.0f}" if price else "--",
                          "change": f"{change:+.2f}",
                          "changeRate": f"{rate:+.2f}%",
                          "open": str(tx_item.get("COpenPrice", "--")),
                          "prevClose": f"{prev_close:,.0f}",
                          "high": str(tx_item.get("CHighPrice", "--")),
                          "low": str(tx_item.get("CLowPrice", "--")),
                          "volume": str(tx_item.get("CTotalVolume", "--"))
                      }
                      print("✅ WTX fetched via TAIFEX API:", wtx_data)
          except Exception as e:
              print("⚠️ TAIFEX API Error:", e)

          # -------------------------------------------------------------
          # 3. 抓取美股四大指數 + VIX 恐慌指數 (加上 Headers 防 403 封鎖)
          # -------------------------------------------------------------
          us_symbols = [
              ("usDJI", "%5EDJI"),      # 道瓊工業
              ("usIXIC", "%5EIXIC"),    # 納斯達克
              ("usGSPC", "%5EGSPC"),    # 標普 500
              ("usSOX", "%5ESOX"),      # 費城半導體
              ("vix", "%5EVIX")          # VIX 恐慌指數
          ]

          us_data = {
              "wtx_night": wtx_data
          }

          # 模擬完整 Browser 請求
          y_headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/121.0.0.0 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
              'Accept-Language': 'en-US,en;q=0.5'
          }

          for key, symbol in us_symbols:
              try:
                  api_url = f"https://query2.finance.yahoo.com/v8/finance/chart/{symbol}?interval=1d&range=1d"
                  res = requests.get(api_url, headers=y_headers, timeout=10)
                  
                  if res.status_code == 200:
                      data = res.json()
                      meta = data['chart']['result'][0]['meta']
                      price = meta.get('regularMarketPrice', 0)
                      prev_close = meta.get('chartPreviousClose', meta.get('previousClose', price))
                      change_val = price - prev_close
                      change_pct = ((change_val) / prev_close * 100) if prev_close else 0

                      us_data[key] = {
                          "price": f"{price:,.2f}",
                          "change": f"{change_val:+.2f}",
                          "changeRate": f"{change_pct:+.2f}%"
                      }
                  else:
                      print(f"⚠️ Yahoo returned status {res.status_code} for {symbol}")
                      us_data[key] = {"price": "--", "change": "0.00", "changeRate": "0.00%"}
              except Exception as err:
                  print(f"Error fetching {symbol}:", err)
                  us_data[key] = {"price": "--", "change": "0.00", "changeRate": "0.00%"}

          # 確保無論如何都會寫入 JSON，避免檔案遺失
          try:
              with open('data/us_stocks.json', 'w', encoding='utf-8') as f:
                  json.dump(us_data, f, ensure_ascii=False, indent=2)
              print("✅ us_stocks.json saved successfully!")
          except Exception as e:
              print("❌ Save JSON error:", e)

          EOF
          python3 scrape.py

      - name: Commit & Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update evening stock, WTX night, VIX data via TAIFEX API" || exit 0
          git push
