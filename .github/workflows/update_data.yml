name: Update Evening Stock Data

on:
  schedule:
    # 台灣時間 18:30 與 21:30 (UTC 10:30, 13:30)
    - cron: '30 10,13 * * *'
  workflow_dispatch: # 支援手動觸發按鈕

permissions:
  contents: write # 開啟 Push 權限

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Evening Data
        run: |
          mkdir -p data
          # 帶上瀏覽器 Header，防止 TWSE 防火牆擋掉
          curl -s -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://openapi.twse.com.tw/v1/exchangeReport/MI_MARGIN" > data/margin.json || echo "[]" > data/margin.json
          curl -s -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://openapi.twse.com.tw/v1/fund/BFI82U" > data/fund.json || echo "[]" > data/fund.json

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update evening stock data" || exit 0
          git push
