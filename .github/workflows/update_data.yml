name: Update Evening Stock Data

on:
  schedule:
    # 台灣時間 18:30 與 21:30 (UTC 10:30, 13:30)
    - cron: '30 10,13 * * *'
  workflow_dispatch: # 支援手動觸發按鈕

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Evening Data
        run: |
          mkdir -p data
          python3 -c "
          import requests, datetime, json

          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
          today = datetime.date.today().strftime('%Y-%m-%d')
          start_date = (datetime.date.today() - datetime.timedelta(days=7)).strftime('%Y-%m-%d')

          # 1. 優先嘗試證交所，若被擋則自動切換至 FinMind 免費源
          def fetch_margin():
              try:
                  r = requests.get('https://openapi.twse.com.tw/v1/exchangeReport/MI_MARGIN', headers=headers, timeout=10)
                  if r.status_code == 200 and r.text.strip().startswith('['):
                      print('✅ TWSE Margin fetch success')
                      return r.text
              except Exception as e:
                  print('TWSE Margin failed:', e)
              
              # 備用方案：FinMind API (抓近 7 天資料並轉為標準格式)
              print('🔄 Switching to FinMind for Margin Data...')
              url = f'https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockMarginPurchaseShortSaleTotal&start_date={start_date}'
              r = requests.get(url, headers=headers, timeout=10)
              if r.status_code == 200:
                  data = r.json().get('data', [])
                  if data:
                      latest = data[-1]
                      formatted = [{
                          '融資餘額(張)': str(latest.get('MarginPurchaseTodayBalance', 0)),
                          '融券餘額(張)': str(latest.get('ShortSaleTodayBalance', 0))
                      }]
                      print('✅ FinMind Margin fetch success')
                      return json.dumps(formatted, ensure_ascii=False)
              return None

          def fetch_fund():
              try:
                  r = requests.get('https://openapi.twse.com.tw/v1/fund/BFI82U', headers=headers, timeout=10)
                  if r.status_code == 200 and r.text.strip().startswith('['):
                      print('✅ TWSE Fund fetch success')
                      return r.text
              except Exception as e:
                  print('TWSE Fund failed:', e)

              # 備用方案：FinMind API
              print('🔄 Switching to FinMind for Fund Data...')
              url = f'https://api.finmindtrade.com/api/v4/data?dataset=TaiwanMarketInstitutionalInvestorsBuySell&start_date={start_date}'
              r = requests.get(url, headers=headers, timeout=10)
              if r.status_code == 200:
                  data = r.json().get('data', [])
                  if data:
                      latest_date = data[-1].get('date')
                      latest_items = [d for d in data if d.get('date') == latest_date]
                      total_net = sum((item.get('buy', 0) - item.get('sell', 0)) for item in latest_items)
                      formatted = [{'買賣差額': str(total_net)}]
                      print('✅ FinMind Fund fetch success')
                      return json.dumps(formatted, ensure_ascii=False)
              return None

          # 執行抓取並寫入檔案
          margin_json = fetch_margin()
          if margin_json:
              with open('data/margin.json', 'w', encoding='utf-8') as f:
                  f.write(margin_json)

          fund_json = fetch_fund()
          if fund_json:
              with open('data/fund.json', 'w', encoding='utf-8') as f:
                  f.write(fund_json)
          "

      - name: Commit & Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update evening stock data" || exit 0
          git push
