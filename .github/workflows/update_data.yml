name: Update Evening Stock Data

on:
  schedule:
    # 台灣時間 22:00, 23:00, 05:00 (對應 UTC 14:00, 15:00, 21:00)
    - cron: '0 14,15,21 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行

permissions:
  contents: write # 開啟寫入/Push 權限

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape Evening Data & Save JSON
        run: |
          mkdir -p data
          cat << 'EOF' > scrape.py
          import requests
          import json
          import re
          from bs4 import BeautifulSoup

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          }

          # 1. 爬取 Yahoo 奇摩股市 - 資券餘額與日期
          try:
              print("Scraping Yahoo Margin Balance Page...")
              url_margin = "https://tw.stock.yahoo.com/margin-balance"
              r = requests.get(url_margin, headers=headers, timeout=15)
              soup = BeautifulSoup(r.text, 'html.parser')

              margin_date = "--"
              margin_buy = "統計中"
              margin_sell = "統計中"

              # 尋找第一筆表格列
              rows = soup.find_all('div', class_=re.compile(r'table-row'))
              
              target_row = None
              for row in rows:
                  date_match = re.search(r'\d{4}/\d{2}/\d{2}', row.get_text())
                  if date_match:
                      target_row = row
                      margin_date = date_match.group(0) # 抓取 2026/08/12
                      break

              if target_row:
                  mend_blocks = target_row.find_all('div', class_=re.compile(r'Mend\(12px\)'))
                  
                  # 解析融資 (第一區塊)
                  if len(mend_blocks) > 0:
                      buy_span = mend_blocks[0].find('span')
                      if buy_span:
                          val = buy_span.get_text(strip=True)
                          if 'c-trend-up' in str(buy_span) and not val.startswith('+'):
                              val = '+' + val
                          margin_buy = f"{val} 億"

                  # 解析融券 (第二區塊)
                  if len(mend_blocks) > 1:
                      sell_span = mend_blocks[1].find('span')
                      if sell_span:
                          val = sell_span.get_text(strip=True)
                          if 'c-trend-up' in str(sell_span) and not val.startswith('+'):
                              val = '+' + val
                          margin_sell = f"{val} 張"

              margin_json = [{
                  '日期': margin_date,
                  '融資餘額(張)': margin_buy,
                  '融券餘額(張)': margin_sell
              }]

              with open('data/margin.json', 'w', encoding='utf-8') as f:
                  json.dump(margin_json, f, ensure_ascii=False, indent=2)
              print("✅ Margin data updated successfully:", margin_json)

          except Exception as e:
              print("❌ Scrape Margin error:", e)

          # 2. 抓取美股四大指數
          try:
              print("Fetching US Stock Indices...")
              us_symbols = [
                  ("usDJI", "^DJI"),
                  ("usIXIC", "^IXIC"),
                  ("usGSPC", "^GSPC"),
                  ("usSOX", "^SOX")
              ]
              us_data = {}

              for key, symbol in us_symbols:
                  try:
                      api_url = f"https://query2.finance.yahoo.com/v8/finance/chart/{symbol}?interval=1d&range=1d"
                      res = requests.get(api_url, headers=headers, timeout=10)
                      data = res.json()
                      meta = data['chart']['result'][0]['meta']
                      price = meta.get('regularMarketPrice', 0)
                      prev_close = meta.get('chartPreviousClose', meta.get('previousClose', price))
                      change_pct = ((price - prev_close) / prev_close * 100) if prev_close else 0

                      us_data[key] = {
                          "price": f"{price:,.2f}",
                          "change": f"{change_pct:+.2f}%"
                      }
                  except Exception as err:
                      print(f"Error fetching {symbol}:", err)
                      us_data[key] = {"price": "--", "change": "0.00%"}

              with open('data/us_stocks.json', 'w', encoding='utf-8') as f:
                  json.dump(us_data, f, ensure_ascii=False, indent=2)
              print("✅ US Stocks data updated:", us_data)
          except Exception as e:
              print("❌ Scrape US error:", e)

          EOF
          python3 scrape.py

      - name: Commit & Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update evening stock data via Yahoo scraping" || exit 0
          git push
