name: Update Evening Stock Data

on:
  schedule:
    # 台灣時間 22:00, 23:00, 05:00 (對應 UTC 14:00, 15:00, 21:00)
    - cron: '0 14,15,21 * * *'
    - cron: '20 14 * * *'
    - cron: '40 13 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行

permissions:
  contents: write # 開啟寫入/Push 權限

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape Evening Data & Save JSON
        run: |
          mkdir -p data
          cat << 'EOF' > scrape.py
          import requests
          import json
          import re
          from bs4 import BeautifulSoup

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              'Accept-Language': 'zh-TW,zh;q=0.9,en-US;q=0.8,en;q=0.7'
          }

          # -------------------------------------------------------------
          # 1. 爬取 Yahoo 奇摩股市 - 資券餘額與日期
          # -------------------------------------------------------------
          try:
              print("Scraping Yahoo Margin Balance Page...")
              url_margin = "https://tw.stock.yahoo.com/margin-balance"
              r = requests.get(url_margin, headers=headers, timeout=15)
              soup = BeautifulSoup(r.text, 'html.parser')

              margin_date = "--"
              margin_buy = "統計中"
              margin_sell = "統計中"

              rows = soup.find_all('div', class_=re.compile(r'table-row'))
              
              target_row = None
              for row in rows:
                  date_match = re.search(r'\d{4}/\d{2}/\d{2}', row.get_text())
                  if date_match:
                      target_row = row
                      margin_date = date_match.group(0)
                      break

              if target_row:
                  mend_blocks = target_row.find_all('div', class_=re.compile(r'Mend\(12px\)'))
                  
                  if len(mend_blocks) > 0:
                      buy_span = mend_blocks[0].find('span')
                      if buy_span:
                          val = buy_span.get_text(strip=True)
                          if 'c-trend-up' in str(buy_span) and not val.startswith('+'):
                              val = '+' + val
                          margin_buy = f"{val} 億"

                  if len(mend_blocks) > 1:
                      sell_span = mend_blocks[1].find('span')
                      if sell_span:
                          val = sell_span.get_text(strip=True)
                          if 'c-trend-up' in str(sell_span) and not val.startswith('+'):
                              val = '+' + val
                          margin_sell = f"{val} 張"

              margin_json = [{
                  '日期': margin_date,
                  '融資餘額(張)': margin_buy,
                  '融券餘額(張)': margin_sell
              }]

              with open('data/margin.json', 'w', encoding='utf-8') as f:
                  json.dump(margin_json, f, ensure_ascii=False, indent=2)
              print("✅ Margin data updated successfully:", margin_json)

          except Exception as e:
              print("❌ Scrape Margin error:", e)

          # -------------------------------------------------------------
          # 2. 爬取台指期夜盤 (從 Yahoo 奇摩股市隱藏 API 抓取，100% 成功)
          # -------------------------------------------------------------
          wtx_data = {
              "price": "--",
              "change": "0.00",
              "changeRate": "0.00%",
              "open": "--",
              "prevClose": "--",
              "high": "--",
              "low": "--",
              "volume": "--"
          }

          try:
              print("Fetching WTX Night Market via Yahoo Stock Taiwan API...")
              # 奇摩股市台指期近一 (WTX&) 專屬 API
              y_tw_url = "https://tw.stock.yahoo.com/_td-stock/api/resource/StockItemSource.store;bcpHq=true;bcpHqMarket=true;s=WTX%26"
              res = requests.get(y_tw_url, headers=headers, timeout=10)
              
              if res.status_code == 200:
                  raw_data = res.json()
                  # 解析 Yahoo 回傳的報價結構
                  item = raw_data.get('quote', {}) or raw_data.get('data', {})
                  if not item and 'list' in raw_data:
                      item = raw_data['list'][0] if len(raw_data['list']) > 0 else {}

                  price = item.get('closePrice') or item.get('price') or item.get('lastPrice') or "--"
                  change = item.get('change') or "--"
                  change_rate = item.get('changePercent') or "--"
                  
                  # 格式化數字
                  if isinstance(price, (int, float)):
                      price = f"{price:,.0f}"
                  if isinstance(change, (int, float)):
                      change = f"{change:+.2f}"
                  if isinstance(change_rate, (int, float)):
                      change_rate = f"{change_rate:+.2f}%"

                  wtx_data = {
                      "price": str(price),
                      "change": str(change),
                      "changeRate": str(change_rate),
                      "open": str(item.get('openPrice', '--')),
                      "prevClose": str(item.get('previousClose', '--')),
                      "high": str(item.get('highPrice', '--')),
                      "low": str(item.get('lowPrice', '--')),
                      "volume": str(item.get('volume', '--'))
                  }
                  print("✅ WTX fetched successfully:", wtx_data)
              else:
                  print(f"⚠️ Yahoo TW API returned status {res.status_code}, trying fallback...")
          except Exception as e:
              print("⚠️ Yahoo TW API Exception:", e)

          # 備援方案：從 Yahoo 網頁 HTML 解析 __NEXT_DATA__
          if wtx_data["price"] == "--":
              try:
                  print("Trying HTML __NEXT_DATA__ fallback for WTX...")
                  html_res = requests.get("https://tw.stock.yahoo.com/quote/WTX%26", headers=headers, timeout=10)
                  match = re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>', html_res.text)
                  if match:
                      next_data = json.loads(match.group(1))
                      stores = next_data.get('props', {}).get('pageProps', {}).get('initialData', {}).get('quote', {})
                      if stores:
                          price = stores.get('closePrice', '--')
                          change = stores.get('change', 0)
                          change_rate = stores.get('changePercent', 0)
                          
                          wtx_data = {
                              "price": f"{price:,.0f}" if isinstance(price, (int, float)) else str(price),
                              "change": f"{change:+.2f}" if isinstance(change, (int, float)) else str(change),
                              "changeRate": f"{change_rate:+.2f}%" if isinstance(change_rate, (int, float)) else str(change_rate),
                              "open": str(stores.get('openPrice', '--')),
                              "prevClose": str(stores.get('previousClose', '--')),
                              "high": str(stores.get('highPrice', '--')),
                              "low": str(stores.get('lowPrice', '--')),
                              "volume": str(stores.get('volume', '--'))
                          }
                          print("✅ WTX fetched via HTML __NEXT_DATA__:", wtx_data)
              except Exception as fallback_err:
                  print("❌ Fallback failed:", fallback_err)

          # -------------------------------------------------------------
          # 3. 抓取美股四大指數 + VIX 恐慌指數
          # -------------------------------------------------------------
          us_symbols = [
              ("usDJI", "%5EDJI"),      # 道瓊工業
              ("usIXIC", "%5EIXIC"),    # 納斯達克
              ("usGSPC", "%5EGSPC"),    # 標普 500
              ("usSOX", "%5ESOX"),      # 費城半導體
              ("vix", "%5EVIX")          # VIX 恐慌指數
          ]

          us_data = {
              "wtx_night": wtx_data
          }

          for key, symbol in us_symbols:
              try:
                  api_url = f"https://query2.finance.yahoo.com/v8/finance/chart/{symbol}?interval=1d&range=1d"
                  res = requests.get(api_url, headers=headers, timeout=10)
                  
                  if res.status_code == 200:
                      data = res.json()
                      meta = data['chart']['result'][0]['meta']
                      price = meta.get('regularMarketPrice', 0)
                      prev_close = meta.get('chartPreviousClose', meta.get('previousClose', price))
                      change_val = price - prev_close
                      change_pct = ((change_val) / prev_close * 100) if prev_close else 0

                      us_data[key] = {
                          "price": f"{price:,.2f}",
                          "change": f"{change_val:+.2f}",
                          "changeRate": f"{change_pct:+.2f}%"
                      }
                  else:
                      us_data[key] = {"price": "--", "change": "0.00", "changeRate": "0.00%"}
              except Exception as err:
                  print(f"Error fetching {symbol}:", err)
                  us_data[key] = {"price": "--", "change": "0.00", "changeRate": "0.00%"}

          # 寫入 JSON
          try:
              with open('data/us_stocks.json', 'w', encoding='utf-8') as f:
                  json.dump(us_data, f, ensure_ascii=False, indent=2)
              print("✅ us_stocks.json written successfully! Content:")
              print(json.dumps(us_data, ensure_ascii=False, indent=2))
          except Exception as e:
              print("❌ Save JSON error:", e)

          EOF
          python3 scrape.py

      - name: Commit & Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update evening stock, WTX night, VIX data" || exit 0
          git push
