name: Update Evening Stock Data

on:
  schedule:
    # 台灣時間 22:00, 23:00, 05:00 (對應 UTC 14:00, 15:00, 21:00)
    - cron: '0 14,15,21 * * *'
    - cron: '20 14 * * *'
    - cron: '40 13 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行

permissions:
  contents: write # 開啟寫入/Push 權限

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 yfinance

      - name: Scrape Evening Data & Save JSON
        run: |
          mkdir -p data
          cat << 'EOF' > scrape.py
          import requests
          import json
          import re
          import yfinance as yf
          from bs4 import BeautifulSoup

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              'Accept-Language': 'zh-TW,zh;q=0.9,en-US;q=0.8,en;q=0.7',
              'Referer': 'https://www.cmoney.tw/'
          }

          # -------------------------------------------------------------
          # 1. 爬取 Yahoo 奇摩股市 - 資券餘額與日期
          # -------------------------------------------------------------
          margin_json = [{
              '日期': '--',
              '融資餘額(張)': '統計中',
              '融券餘額(張)': '統計中'
          }]

          try:
              print("Scraping Yahoo Margin Balance Page...")
              url_margin = "https://tw.stock.yahoo.com/margin-balance"
              r = requests.get(url_margin, headers=headers, timeout=15)
              soup = BeautifulSoup(r.text, 'html.parser')

              margin_date = "--"
              margin_buy = "統計中"
              margin_sell = "統計中"

              rows = soup.find_all('div', class_=re.compile(r'table-row'))
              target_row = None
              for row in rows:
                  date_match = re.search(r'\d{4}/\d{2}/\d{2}', row.get_text())
                  if date_match:
                      target_row = row
                      margin_date = date_match.group(0)
                      break

              if target_row:
                  mend_blocks = target_row.find_all('div', class_=re.compile(r'Mend\(12px\)'))
                  if len(mend_blocks) > 0:
                      buy_span = mend_blocks[0].find('span')
                      if buy_span:
                          val = buy_span.get_text(strip=True)
                          if 'c-trend-up' in str(buy_span) and not val.startswith('+'):
                              val = '+' + val
                          margin_buy = f"{val} 億"

                  if len(mend_blocks) > 1:
                      sell_span = mend_blocks[1].find('span')
                      if sell_span:
                          val = sell_span.get_text(strip=True)
                          if 'c-trend-up' in str(sell_span) and not val.startswith('+'):
                              val = '+' + val
                          margin_sell = f"{val} 張"

              margin_json = [{
                  '日期': margin_date,
                  '融資餘額(張)': margin_buy,
                  '融券餘額(張)': margin_sell
              }]
          except Exception as e:
              print("❌ Scrape Margin error:", e)

          # 獨立存檔 margin.json，避免後續程式中斷影響此檔
          try:
              with open('data/margin.json', 'w', encoding='utf-8') as f:
                  json.dump(margin_json, f, ensure_ascii=False, indent=2)
              print("✅ Margin data saved:", margin_json)
          except Exception as e:
              print("❌ Write margin.json failed:", e)

          # -------------------------------------------------------------
          # 2. 爬取 CMoney 台指期頁面 (TXF1)
          # -------------------------------------------------------------
          wtx_data = {
              "price": "--",
              "change": "0.00",
              "changeRate": "0.00%",
              "open": "--",
              "prevClose": "--",
              "high": "--",
              "low": "--",
              "volume": "--"
          }

          try:
              print("Scraping CMoney WTX Night Market Page...")
              cmoney_url = "https://www.cmoney.tw/forum/futures/TXF1?s=p"
              res = requests.get(cmoney_url, headers=headers, timeout=10)
              html_text = res.text

              # 方案 A: 全域搜尋 HTML 中的價格數字與漲跌
              p_match = re.search(r'stockData__price[^>]*>\s*([\d,.]+)', html_text)
              c_match = re.search(r'stockData__quotePrice[^>]*>\s*([\d,.-]+)', html_text)
              r_match = re.search(r'stockData__quote[^>]*>\s*\(([^)]+)\)', html_text)

              if p_match:
                  price_str = p_match.group(1).strip()
                  chg_str = c_match.group(1).strip() if c_match else "0.00"
                  rate_str = r_match.group(1).strip() if r_match else "0.00%"

                  # 補正顏色正負號
                  if "text-functional-fall" in html_text and not chg_str.startswith('-'):
                      chg_str = f"-{chg_str}"
                  elif "text-functional-rise" in html_text and not chg_str.startswith('+'):
                      chg_str = f"+{chg_str}"

                  wtx_data["price"] = price_str
                  wtx_data["change"] = chg_str
                  wtx_data["changeRate"] = rate_str
                  print("✅ WTX fetched via CMoney Regex:", wtx_data)
              else:
                  # 方案 B: 備援搜尋 JSON 格式欄位
                  close_m = re.search(r'"Close":\s*([0-9.]+)', html_text)
                  change_m = re.search(r'"Change":\s*([-0-9.]+)', html_text)
                  rate_m = re.search(r'"ChangePercent":\s*([-0-9.]+)', html_text)
                  if close_m:
                      wtx_data["price"] = f"{float(close_m.group(1)):,.0f}"
                      wtx_data["change"] = f"{float(change_m.group(1)):+.2f}" if change_m else "0.00"
                      wtx_data["changeRate"] = f"{float(rate_m.group(1)):+.2f}%" if rate_m else "0.00%"
                      print("✅ WTX fetched via CMoney JSON Regex:", wtx_data)
          except Exception as e:
              print("❌ CMoney Scrape Error:", e)

          # -------------------------------------------------------------
          # 3. 抓取美股四大指數 + VIX 恐慌指數 (yfinance)
          # -------------------------------------------------------------
          us_symbols = [
              ("usDJI", "^DJI"),      # 道瓊工業
              ("usIXIC", "^IXIC"),    # 納斯達克
              ("usGSPC", "^GSPC"),    # 標普 500
              ("usSOX", "^SOX"),      # 費城半導體
              ("vix", "^VIX")          # VIX 恐慌指數
          ]

          us_data = {
              "wtx_night": wtx_data
          }

          print("Fetching US Stock Indices & VIX via yfinance...")
          for key, symbol in us_symbols:
              try:
                  ticker = yf.Ticker(symbol)
                  info = ticker.fast_info
                  price = info.last_price
                  prev_close = info.previous_close

                  if price and prev_close:
                      change_val = price - prev_close
                      change_pct = (change_val / prev_close) * 100
                      
                      us_data[key] = {
                          "price": f"{price:,.2f}",
                          "change": f"{change_val:+.2f}",
                          "changeRate": f"{change_pct:+.2f}%"
                      }
                  else:
                      us_data[key] = {"price": "--", "change": "0.00", "changeRate": "0.00%"}
              except Exception as err:
                  print(f"Error fetching {symbol} via yfinance:", err)
                  us_data[key] = {"price": "--", "change": "0.00", "changeRate": "0.00%"}

          # 獨立存檔 us_stocks.json
          try:
              with open('data/us_stocks.json', 'w', encoding='utf-8') as f:
                  json.dump(us_data, f, ensure_ascii=False, indent=2)
              print("✅ us_stocks.json successfully written!")
          except Exception as e:
              print("❌ Write us_stocks.json failed:", e)

          EOF
          python3 scrape.py

      - name: Commit & Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update evening stock, WTX night, VIX data" || exit 0
          git push
