name: Update Evening Stock Data

on:
  schedule:
    # 台灣時間 22:00, 23:00, 05:00 (對應 UTC 14:00, 15:00, 21:00)
    - cron: '0 14,15,21 * * *'
    - cron: '20 14 * * *'
    - cron: '40 13 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行

permissions:
  contents: write # 開啟寫入/Push 權限

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape Evening Data & Save JSON
        run: |
          mkdir -p data
          cat << 'EOF' > scrape.py
          import requests
          import json
          import re
          from bs4 import BeautifulSoup

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Referer': 'https://www.cmoney.tw/'
          }

          # -------------------------------------------------------------
          # 1. 爬取 Yahoo 奇摩股市 - 資券餘額與日期
          # -------------------------------------------------------------
          try:
              print("Scraping Yahoo Margin Balance Page...")
              url_margin = "https://tw.stock.yahoo.com/margin-balance"
              r = requests.get(url_margin, headers=headers, timeout=15)
              soup = BeautifulSoup(r.text, 'html.parser')

              margin_date = "--"
              margin_buy = "統計中"
              margin_sell = "統計中"

              rows = soup.find_all('div', class_=re.compile(r'table-row'))
              
              target_row = None
              for row in rows:
                  date_match = re.search(r'\d{4}/\d{2}/\d{2}', row.get_text())
                  if date_match:
                      target_row = row
                      margin_date = date_match.group(0)
                      break

              if target_row:
                  mend_blocks = target_row.find_all('div', class_=re.compile(r'Mend\(12px\)'))
                  
                  # 解析融資
                  if len(mend_blocks) > 0:
                      buy_span = mend_blocks[0].find('span')
                      if buy_span:
                          val = buy_span.get_text(strip=True)
                          if 'c-trend-up' in str(buy_span) and not val.startswith('+'):
                              val = '+' + val
                          margin_buy = f"{val} 億"

                  # 解析融券
                  if len(mend_blocks) > 1:
                      sell_span = mend_blocks[1].find('span')
                      if sell_span:
                          val = sell_span.get_text(strip=True)
                          if 'c-trend-up' in str(sell_span) and not val.startswith('+'):
                              val = '+' + val
                          margin_sell = f"{val} 張"

              margin_json = [{
                  '日期': margin_date,
                  '融資餘額(張)': margin_buy,
                  '融券餘額(張)': margin_sell
              }]

              with open('data/margin.json', 'w', encoding='utf-8') as f:
                  json.dump(margin_json, f, ensure_ascii=False, indent=2)
              print("✅ Margin data updated successfully:", margin_json)

          except Exception as e:
              print("❌ Scrape Margin error:", e)

          # -------------------------------------------------------------
          # 2. 抓取台指期夜盤數據 (優先呼叫 CMoney/Yahoo API)
          # -------------------------------------------------------------
          wtx_data = {
              "price": "--",
              "change": "0.00",
              "changeRate": "0.00%",
              "open": "--",
              "prevClose": "--",
              "high": "--",
              "low": "--",
              "volume": "--"
          }

          # 方法 A: 嘗試使用 Yahoo 奇摩股市台指期近一 API (WTX&)
          try:
              print("Fetching WTX Night Market from Yahoo API...")
              yahoo_fut_url = "https://query1.finance.yahoo.com/v8/finance/chart/WTX%26?interval=1d&range=1d"
              res = requests.get(yahoo_fut_url, headers=headers, timeout=10)
              if res.status_code == 200:
                  meta = res.json()['chart']['result'][0]['meta']
                  price = meta.get('regularMarketPrice', 0)
                  prev_close = meta.get('chartPreviousClose', meta.get('previousClose', price))
                  diff = price - prev_close
                  diff_pct = (diff / prev_close * 100) if prev_close else 0

                  wtx_data = {
                      "price": f"{price:,.0f}",
                      "change": f"{diff:+.2f}",
                      "changeRate": f"{diff_pct:+.2f}%",
                      "open": f"{meta.get('regularMarketDayHigh', '--')}",
                      "prevClose": f"{prev_close:,.0f}",
                      "high": f"{meta.get('dayHigh', '--')}",
                      "low": f"{meta.get('dayLow', '--')}",
                      "volume": f"{meta.get('regularMarketVolume', '--')}"
                  }
                  print("✅ WTX fetched via Yahoo API:", wtx_data)
          except Exception as e:
              print("⚠️ Yahoo WTX API failed, switching to CMoney API...", e)

          # 方法 B: 若 Yahoo 抓不到，備援使用 CMoney API
          if wtx_data["price"] == "--":
              try:
                  cmoney_url = "https://www.cmoney.tw/forum/api/v1/stock/quote?symbol=TXF1"
                  res = requests.get(cmoney_url, headers=headers, timeout=10)
                  if res.status_code == 200:
                      d = res.json()
                      price = d.get('Close', 0)
                      change = d.get('Change', 0)
                      change_rate = d.get('ChangePercent', 0)
                      
                      wtx_data = {
                          "price": f"{price:,.0f}",
                          "change": f"{change:+.2f}",
                          "changeRate": f"{change_rate:+.2f}%",
                          "open": f"{d.get('Open', '--')}",
                          "prevClose": f"{d.get('PreClose', '--')}",
                          "high": f"{d.get('High', '--')}",
                          "low": f"{d.get('Low', '--')}",
                          "volume": f"{d.get('TotalVolume', '--')}"
                      }
                      print("✅ WTX fetched via CMoney API:", wtx_data)
              except Exception as e:
                  print("❌ CMoney API also failed:", e)

          # -------------------------------------------------------------
          # 3. 抓取美股四大指數 + VIX 恐慌指數 (Yahoo Finance API)
          # -------------------------------------------------------------
          try:
              print("Fetching US Stock Indices & VIX...")
              us_symbols = [
                  ("usDJI", "^DJI"),      # 道瓊工業
                  ("usIXIC", "^IXIC"),    # 納斯達克
                  ("usGSPC", "^GSPC"),    # 標普 500
                  ("usSOX", "^SOX"),      # 費城半導體
                  ("vix", "^VIX")          # VIX 恐慌指數
              ]
              us_data = {
                  "wtx_night": wtx_data
              }

              for key, symbol in us_symbols:
                  try:
                      api_url = f"https://query2.finance.yahoo.com/v8/finance/chart/{symbol}?interval=1d&range=1d"
                      res = requests.get(api_url, headers=headers, timeout=10)
                      data = res.json()
                      meta = data['chart']['result'][0]['meta']
                      price = meta.get('regularMarketPrice', 0)
                      prev_close = meta.get('chartPreviousClose', meta.get('previousClose', price))
                      change_val = price - prev_close
                      change_pct = ((change_val) / prev_close * 100) if prev_close else 0

                      us_data[key] = {
                          "price": f"{price:,.2f}",
                          "change": f"{change_val:+.2f}",
                          "changeRate": f"{change_pct:+.2f}%"
                      }
                  except Exception as err:
                      print(f"Error fetching {symbol}:", err)
                      us_data[key] = {"price": "--", "change": "0.00", "changeRate": "0.00%"}

              with open('data/us_stocks.json', 'w', encoding='utf-8') as f:
                  json.dump(us_data, f, ensure_ascii=False, indent=2)
              print("✅ US Stocks & VIX data updated:", us_data)
          except Exception as e:
              print("❌ Scrape US/VIX error:", e)

          EOF
          python3 scrape.py

      - name: Commit & Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update evening stock, WTX night, VIX data via API" || exit 0
          git push
