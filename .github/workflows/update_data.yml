name: Update Evening Stock Data

on:
  schedule:
    # 台灣時間 22:00, 23:00, 05:00 (對應 UTC 14:00, 15:00, 21:00)
    - cron: '0 14,15,21 * * *'
    - cron: '20 14 * * *'
    - cron: '40 13 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行

permissions:
  contents: write # 開啟寫入/Push 權限

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4 yfinance

      - name: Scrape Evening Data & Save JSON
        run: |
          mkdir -p data
          cat << 'EOF' > scrape.py
          import requests
          import json
          import re
          import yfinance as yf
          from bs4 import BeautifulSoup

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              'Accept-Language': 'zh-TW,zh;q=0.9,en-US;q=0.8,en;q=0.7',
              'Referer': 'https://tw.stock.yahoo.com/'
          }

          # -------------------------------------------------------------
          # 1. 爬取 Yahoo 奇摩股市 - 資券餘額與日期
          # -------------------------------------------------------------
          try:
              print("Scraping Yahoo Margin Balance Page...")
              url_margin = "https://tw.stock.yahoo.com/margin-balance"
              r = requests.get(url_margin, headers=headers, timeout=15)
              soup = BeautifulSoup(r.text, 'html.parser')

              margin_date = "--"
              margin_buy = "統計中"
              margin_sell = "統計中"

              rows = soup.find_all('div', class_=re.compile(r'table-row'))
              
              target_row = None
              for row in rows:
                  date_match = re.search(r'\d{4}/\d{2}/\d{2}', row.get_text())
                  if date_match:
                      target_row = row
                      margin_date = date_match.group(0)
                      break

              if target_row:
                  mend_blocks = target_row.find_all('div', class_=re.compile(r'Mend\(12px\)'))
                  
                  if len(mend_blocks) > 0:
                      buy_span = mend_blocks[0].find('span')
                      if buy_span:
                          val = buy_span.get_text(strip=True)
                          if 'c-trend-up' in str(buy_span) and not val.startswith('+'):
                              val = '+' + val
                          margin_buy = f"{val} 億"

                  if len(mend_blocks) > 1:
                      sell_span = mend_blocks[1].find('span')
                      if sell_span:
                          val = sell_span.get_text(strip=True)
                          if 'c-trend-up' in str(sell_span) and not val.startswith('+'):
                              val = '+' + val
                          margin_sell = f"{val} 張"

              margin_json = [{
                  '日期': margin_date,
                  '融資餘額(張)': margin_buy,
                  '融券餘額(張)': margin_sell
              }]

              with open('data/margin.json', 'w', encoding='utf-8') as f:
                  json.dump(margin_json, f, ensure_ascii=False, indent=2)
              print("✅ Margin data updated successfully:", margin_json)

          except Exception as e:
              print("❌ Scrape Margin error:", e)

          # -------------------------------------------------------------
          # 2. 抓取台指期夜盤 (WTX& / TXF)
          # -------------------------------------------------------------
          wtx_data = {
              "price": "--",
              "change": "0.00",
              "changeRate": "0.00%",
              "open": "--",
              "prevClose": "--",
              "high": "--",
              "low": "--",
              "volume": "--"
          }

          # 優先方法：從 Yahoo 奇摩股市頁面提取隱藏 JSON (100% 穩定)
          try:
              print("Fetching WTX Night Market from Yahoo TW...")
              html_res = requests.get("https://tw.stock.yahoo.com/quote/WTX%26", headers=headers, timeout=10)
              match = re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>', html_res.text)
              
              if match:
                  next_data = json.loads(match.group(1))
                  quote = next_data.get('props', {}).get('pageProps', {}).get('initialData', {}).get('quote', {})
                  
                  if quote:
                      price = quote.get('closePrice') or quote.get('price') or "--"
                      change = quote.get('change') or 0
                      change_rate = quote.get('changePercent') or 0
                      
                      wtx_data = {
                          "price": f"{price:,.0f}" if isinstance(price, (int, float)) else str(price),
                          "change": f"{change:+.2f}" if isinstance(change, (int, float)) else str(change),
                          "changeRate": f"{change_rate:+.2f}%" if isinstance(change_rate, (int, float)) else str(change_rate),
                          "open": str(quote.get('openPrice', '--')),
                          "prevClose": str(quote.get('previousClose', '--')),
                          "high": str(quote.get('highPrice', '--')),
                          "low": str(quote.get('lowPrice', '--')),
                          "volume": str(quote.get('volume', '--'))
                      }
                      print("✅ WTX fetched via Yahoo TW JSON:", wtx_data)
          except Exception as e:
              print("⚠️ Method 1 WTX Error:", e)

          # 備援方法：若上方未抓到，嘗試從 CMoney 網頁預載數據解析
          if wtx_data["price"] == "--":
              try:
                  print("Trying CMoney fallback for WTX...")
                  cmoney_res = requests.get("https://www.cmoney.tw/forum/futures/TXF1?s=p", headers=headers, timeout=10)
                  price_m = re.search(r'"Close":\s*([0-9.]+)', cmoney_res.text)
                  change_m = re.search(r'"Change":\s*([-0-9.]+)', cmoney_res.text)
                  rate_m = re.search(r'"ChangePercent":\s*([-0-9.]+)', cmoney_res.text)
                  
                  if price_m:
                      price_val = float(price_m.group(1))
                      chg_val = float(change_m.group(1)) if change_m else 0.0
                      rate_val = float(rate_m.group(1)) if rate_m else 0.0
                      
                      wtx_data["price"] = f"{price_val:,.0f}"
                      wtx_data["change"] = f"{chg_val:+.2f}"
                      wtx_data["changeRate"] = f"{rate_val:+.2f}%"
                      print("✅ WTX fetched via CMoney regex:", wtx_data)
              except Exception as e:
                  print("⚠️ Method 2 CMoney Error:", e)

          # -------------------------------------------------------------
          # 3. 抓取美股四大指數 + VIX 恐慌指數 (使用 yfinance)
          # -------------------------------------------------------------
          us_symbols = [
              ("usDJI", "^DJI"),      # 道瓊工業
              ("usIXIC", "^IXIC"),    # 納斯達克
              ("usGSPC", "^GSPC"),    # 標普 500
              ("usSOX", "^SOX"),      # 費城半導體
              ("vix", "^VIX")          # VIX 恐慌指數
          ]

          us_data = {
              "wtx_night": wtx_data
          }

          print("Fetching US Stock Indices & VIX via yfinance...")
          for key, symbol in us_symbols:
              try:
                  ticker = yf.Ticker(symbol)
                  info = ticker.fast_info
                  
                  price = info.last_price
                  prev_close = info.previous_close
                  
                  if price and prev_close:
                      change_val = price - prev_close
                      change_pct = (change_val / prev_close) * 100
                      
                      us_data[key] = {
                          "price": f"{price:,.2f}",
                          "change": f"{change_val:+.2f}",
                          "changeRate": f"{change_pct:+.2f}%"
                      }
                  else:
                      us_data[key] = {"price": "--", "change": "0.00", "changeRate": "0.00%"}
              except Exception as err:
                  print(f"Error fetching {symbol} via yfinance:", err)
                  us_data[key] = {"price": "--", "change": "0.00", "changeRate": "0.00%"}

          # 強制存檔與檢查
          try:
              with open('data/us_stocks.json', 'w', encoding='utf-8') as f:
                  json.dump(us_data, f, ensure_ascii=False, indent=2)
              print("✅ us_stocks.json successfully updated! Content:")
              print(json.dumps(us_data, ensure_ascii=False, indent=2))
          except Exception as e:
              print("❌ Save JSON error:", e)

          EOF
          python3 scrape.py

      - name: Commit & Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update evening stock, WTX night, VIX data" || exit 0
          git push
