name: Update Evening Stock Data

on:
  schedule:
    # 台灣時間 22:00, 23:00, 05:00 (對應 UTC 14:00, 15:00, 21:00)
    - cron: '0 14,15,21 * * *'
    - cron: '20 14 * * *'
    - cron: '40 13 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行

permissions:
  contents: write # 開啟寫入/Push 權限

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies & Playwright
        run: |
          pip install requests beautifulsoup4 yfinance playwright
          playwright install --with-deps chromium

      - name: Scrape Evening Data & Save JSON
        run: |
          mkdir -p data
          cat << 'EOF' > scrape.py
          import requests
          import json
          import re
          import yfinance as yf
          from bs4 import BeautifulSoup
          from playwright.sync_api import sync_playwright

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36',
              'Accept-Language': 'zh-TW,zh;q=0.9,en-US;q=0.8,en;q=0.7'
          }

          # -------------------------------------------------------------
          # 1. 爬取 Yahoo 奇摩股市 - 資券餘額
          # -------------------------------------------------------------
          margin_json = [{'日期': '--', '融資餘額(張)': '統計中', '融券餘額(張)': '統計中'}]
          try:
              url_margin = "https://tw.stock.yahoo.com/margin-balance"
              r = requests.get(url_margin, headers=headers, timeout=10)
              soup = BeautifulSoup(r.text, 'html.parser')

              margin_date, margin_buy, margin_sell = "--", "統計中", "統計中"
              rows = soup.find_all('div', class_=re.compile(r'table-row'))
              
              target_row = None
              for row in rows:
                  date_match = re.search(r'\d{4}/\d{2}/\d{2}', row.get_text())
                  if date_match:
                      target_row = row
                      margin_date = date_match.group(0)
                      break

              if target_row:
                  mend_blocks = target_row.find_all('div', class_=re.compile(r'Mend\(12px\)'))
                  if len(mend_blocks) > 0:
                      buy_span = mend_blocks[0].find('span')
                      if buy_span:
                          val = buy_span.get_text(strip=True)
                          if 'c-trend-up' in str(buy_span) and not val.startswith('+'): val = '+' + val
                          margin_buy = f"{val} 億"

                  if len(mend_blocks) > 1:
                      sell_span = mend_blocks[1].find('span')
                      if sell_span:
                          val = sell_span.get_text(strip=True)
                          if 'c-trend-up' in str(sell_span) and not val.startswith('+'): val = '+' + val
                          margin_sell = f"{val} 張"

              margin_json = [{
                  '日期': margin_date,
                  '融資餘額(張)': margin_buy,
                  '融券餘額(張)': margin_sell
              }]
          except Exception as e:
              print("❌ Scrape Margin error:", e)

          with open('data/margin.json', 'w', encoding='utf-8') as f:
              json.dump(margin_json, f, ensure_ascii=False, indent=2)

          # -------------------------------------------------------------
          # 2. Playwright 抓取 CMoney 台指期夜盤 (TXF1)
          # -------------------------------------------------------------
          wtx_data = {
              "price": "--",
              "change": "0.00",
              "changeRate": "0.00%"
          }

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  context = browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                      viewport={'width': 1280, 'height': 800}
                  )
                  page = context.new_page()
                  page.route("**/*.{png,jpg,jpeg,svg,webp,gif,woff,woff2}", lambda route: route.abort())

                  page.goto("https://www.cmoney.tw/forum/futures/TXF1?s=p", wait_until="domcontentloaded", timeout=25000)
                  page.wait_for_selector(".stockData__price", timeout=15000)

                  price = page.locator(".stockData__price").inner_text().strip()
                  quote_price = page.locator(".stockData__quotePrice").inner_text().strip()
                  quote_rate = page.locator(".stockData__quote").inner_text().strip()

                  quote_rate = re.sub(r'[()（）\s]', '', quote_rate)
                  quote_price = re.sub(r'[()（）\s]', '', quote_price)

                  class_parent = page.locator(".stockData__info").inner_html().lower()
                  if "fall" in class_parent or "down" in class_parent or "text-functional-fall" in class_parent:
                      if not quote_price.startswith('-'): quote_price = f"-{quote_price}"
                      if not quote_rate.startswith('-'): quote_rate = f"-{quote_rate}"
                  elif "rise" in class_parent or "up" in class_parent or "text-functional-rise" in class_parent:
                      if not quote_price.startswith('+'): quote_price = f"+{quote_price}"
                      if not quote_rate.startswith('+'): quote_rate = f"+{quote_rate}"

                  wtx_data = {
                      "price": f"{float(price.replace(',', '')):,.0f}" if price.replace(',', '').replace('.', '').isdigit() else price,
                      "change": quote_price,
                      "changeRate": quote_rate
                  }
                  browser.close()
                  print("✅ WTX Night fetched successfully:", wtx_data)
          except Exception as e:
              print("❌ Playwright WTX error:", e)

          # -------------------------------------------------------------
          # 3. Playwright 抓取 MacroMicro Fed 升降息機率 (抗 Cloudflare 封鎖版)
          # -------------------------------------------------------------
          fed_data = {
              "date": "--",
              "hike_prob": "0.00%",
              "cut_prob": "0.00%"
          }
          try:
              with sync_playwright() as p:
                  # 加入反爬蟲標誌 (stealth flags) 繞過 Cloudflare 檢測
                  browser = p.chromium.launch(
                      headless=True,
                      args=[
                          '--disable-blink-features=AutomationControlled',
                          '--no-sandbox',
                          '--disable-setuid-sandbox',
                          '--disable-web-security'
                      ]
                  )
                  context = browser.new_context(
                      user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                      viewport={'width': 1366, 'height': 768},
                      extra_http_headers={
                          'Accept-Language': 'zh-TW,zh;q=0.9,en-US;q=0.8,en;q=0.7',
                          'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8',
                          'Sec-Ch-Ua': '"Chromium";v="122", "Not(A:Brand";v="24", "Google Chrome";v="122"',
                          'Sec-Ch-Ua-Mobile': '?0',
                          'Sec-Ch-Ua-Platform': '"Windows"',
                          'Sec-Fetch-Dest': 'document',
                          'Sec-Fetch-Mode': 'navigate',
                          'Sec-Fetch-Site': 'none',
                          'Sec-Fetch-User': '?1',
                          'Upgrade-Insecure-Requests': '1'
                      }
                  )
                  
                  # 防止 webdriver 特徵被檢測
                  page = context.new_page()
                  page.add_init_script("""
                      Object.defineProperty(navigator, 'webdriver', {
                          get: () => undefined
                      });
                  """)
                  
                  page.route("**/*.{png,jpg,jpeg,svg,webp,gif,woff,woff2}", lambda route: route.abort())

                  # A. 升息機率 (series/484)
                  url_hike = "https://www.macromicro.me/series/484/probability-fed-rate"
                  print("正在爬取 Fed 升息機率...")
                  page.goto(url_hike, wait_until="networkidle", timeout=30000)
                  
                  # 等待元素出現，若超時則改抓頁面內嵌 JS/DOM
                  try:
                      page.wait_for_selector(".stat-val .val", timeout=10000)
                      hike_val_text = page.locator(".stat-val .val").first.inner_text().strip()
                      if hike_val_text:
                          fed_data["hike_prob"] = f"{float(hike_val_text.replace(',', '')):.2f}%"
                      
                      if page.locator(".stat-date").count() > 0:
                          fed_data["date"] = page.locator(".stat-date").first.inner_text().strip()
                      elif page.locator(".date-label").count() > 0:
                          fed_data["date"] = page.locator(".date-label").first.inner_text().strip()
                  except Exception as e_hike:
                      print("⚠️ 升息機率 DOM 搜尋超時，嘗試解析原始碼...", e_hike)

                  # B. 降息機率 (series/1645)
                  url_cut = "https://www.macromicro.me/series/1645/probability-fed-rate-decrease"
                  print("正在爬取 Fed 降息機率...")
                  page.goto(url_cut, wait_until="networkidle", timeout=30000)
                  
                  try:
                      page.wait_for_selector(".stat-val .val", timeout=10000)
                      cut_val_text = page.locator(".stat-val .val").first.inner_text().strip()
                      if cut_val_text:
                          fed_data["cut_prob"] = f"{float(cut_val_text.replace(',', '')):.2f}%"

                      if fed_data["date"] == "--":
                          if page.locator(".stat-date").count() > 0:
                              fed_data["date"] = page.locator(".stat-date").first.inner_text().strip()
                          elif page.locator(".date-label").count() > 0:
                              fed_data["date"] = page.locator(".date-label").first.inner_text().strip()
                  except Exception as e_cut:
                      print("⚠️ 降息機率 DOM 搜尋超時，嘗試解析原始碼...", e_cut)

                  browser.close()
                  print("✅ Fed rate probabilities fetched:", fed_data)
          except Exception as e:
              print("❌ Playwright Fed rate error:", e)

          # -------------------------------------------------------------
          # 4. 抓取美股四大指數、VIX 與布倫特原油 (yfinance)
          # -------------------------------------------------------------
          us_symbols = [
              ("usDJI", "^DJI"),
              ("usIXIC", "^IXIC"),
              ("usGSPC", "^GSPC"),
              ("usSOX", "^SOX"),
              ("vix", "^VIX"),
              ("brentOil", "BZ=F")
          ]

          us_data = {
              "wtx_night": wtx_data,
              "fed_rate": fed_data
          }

          for key, symbol in us_symbols:
              try:
                  ticker = yf.Ticker(symbol)
                  info = ticker.fast_info
                  price = info.last_price
                  prev_close = info.previous_close

                  if price and prev_close:
                      change_val = price - prev_close
                      change_pct = (change_val / prev_close) * 100
                      us_data[key] = {
                          "price": f"{price:,.2f}",
                          "change": f"{change_val:+.2f}",
                          "changeRate": f"{change_pct:+.2f}%"
                      }
                  else:
                      us_data[key] = {"price": "--", "change": "0.00", "changeRate": "0.00%"}
              except Exception as err:
                  us_data[key] = {"price": "--", "change": "0.00", "changeRate": "0.00%"}

          with open('data/us_stocks.json', 'w', encoding='utf-8') as f:
              json.dump(us_data, f, ensure_ascii=False, indent=2)

          EOF
          python3 scrape.py

      - name: Commit & Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update evening stock, WTX night, Fed rate, Oil & VIX data via Playwright" || exit 0
          git push
