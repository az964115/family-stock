name: Update Evening Stock Data

on:
  schedule:
    # 台灣時間 18:30 與 21:30 (UTC 10:30, 13:30)
    - cron: '30 10,13 * * *'
  workflow_dispatch: # 支援手動觸發按鈕

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Evening Data via Python Session
        run: |
          mkdir -p data
          python3 -c "
          import requests

          # 建立 Session 以保持 Cookie
          session = requests.Session()

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Accept-Language': 'zh-TW,zh;q=0.9,en-US;q=0.8,en;q=0.7',
              'Connection': 'keep-alive',
              'Sec-Fetch-Dest': 'empty',
              'Sec-Fetch-Mode': 'cors',
              'Sec-Fetch-Site': 'same-site'
          }

          session.headers.update(headers)

          try:
              # 第一步：先存取證交所主站建立 session/cookie
              print('Establishing session with TWSE...')
              session.get('https://www.twse.com.tw/zh/', timeout=15)

              # 第二步：帶上完整的 Cookie 請求資券餘額
              print('Fetching margin data...')
              r1 = session.get('https://openapi.twse.com.tw/v1/exchangeReport/MI_MARGIN', timeout=15)
              print('Margin Status:', r1.status_code)
              
              if r1.status_code == 200 and r1.text.strip().startswith('['):
                  with open('data/margin.json', 'w', encoding='utf-8') as f:
                      f.write(r1.text)
                  print('✅ Margin data successfully updated!')
              else:
                  print('⚠️ Margin fetch got non-JSON output, preserving fallback/empty.')

              # 第三步：請求三大法人買賣超
              print('Fetching fund data...')
              r2 = session.get('https://openapi.twse.com.tw/v1/fund/BFI82U', timeout=15)
              print('Fund Status:', r2.status_code)

              if r2.status_code == 200 and r2.text.strip().startswith('['):
                  with open('data/fund.json', 'w', encoding='utf-8') as f:
                      f.write(r2.text)
                  print('✅ Fund data successfully updated!')
              else:
                  print('⚠️ Fund fetch got non-JSON output, preserving fallback/empty.')

          except Exception as e:
              print('❌ Session Request Error:', e)
          "

      - name: Commit & Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update evening stock data" || exit 0
          git push
