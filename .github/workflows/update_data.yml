name: Update Evening Stock Data

on:
  schedule:
    # 台灣時間 22:00, 23:00, 05:00 (對應 UTC 14:00, 15:00, 21:00)
    - cron: '0 14,15,21 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行

permissions:
  contents: write # 開啟寫入/Push 權限

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape Evening Data & Save JSON
        run: |
          mkdir -p data
          cat << 'EOF' > scrape.py
          import requests
          import json
          import re
          from bs4 import BeautifulSoup

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          }

          # 1. 爬取 Yahoo 奇摩股市 - 資券餘額 (從 window._INITIAL_DATA_ 解析)
          try:
              print("Scraping Yahoo Margin Balance Page...")
              url_margin = "https://tw.stock.yahoo.com/margin-balance"
              r = requests.get(url_margin, headers=headers, timeout=15)
              
              margin_buy = "統計中"
              margin_sell = "統計中"

              # 策略 A: 直接解析網頁內部的 window._INITIAL_DATA_ JSON 資料
              json_match = re.search(r'window\._INITIAL_DATA_\s*=\s*(\{.*?\});</script>', r.text)
              if json_match:
                  try:
                      raw_json = json.loads(json_match.group(1))
                      # 在 Initial Data 中遞迴搜尋包含 margin/balance 的數據區塊
                      raw_str = json.dumps(raw_json, ensure_ascii=False)
                      
                      # 利用正則尋找融資增減與融券增減
                      # 尋找 "融資" 相關的增減數值 (如 39.32)
                      buy_match = re.search(r'"marginPurchase"[^}]*?"change"\s*:\s*"([\-+]?[\d,\.]+)"', raw_str)
                      if not buy_match:
                          buy_match = re.search(r'融資[^\d\-+]*([\-+]?\d+(?:\.\d+)?)\s*(?:億|張)', raw_str)
                      if buy_match:
                          margin_buy = f"{buy_match.group(1)} 億"

                      sell_match = re.search(r'"shortSale"[^}]*?"change"\s*:\s*"([\-+]?[\d,\.]+)"', raw_str)
                      if not sell_match:
                          sell_match = re.search(r'融券[^\d\-+]*([\-+]?\d+(?:\.\d+)?)\s*(?:張|億)', raw_str)
                      if sell_match:
                          margin_sell = f"{sell_match.group(1)} 張"
                  except Exception as err:
                      print("JSON parsing inner data error:", err)

              # 策略 B: 備用全頁面文字正則掃描 (比對 +39.32 或 -XX 等格式)
              if margin_buy == "統計中":
                  soup = BeautifulSoup(r.text, 'html.parser')
                  text = soup.get_text()
                  # 尋找帶有 +/- 的浮點數 (如 39.32)
                  diff_matches = re.findall(r'[\+\-]\d+(?:\.\d+)?', text)
                  if diff_matches:
                      margin_buy = f"{diff_matches[0]} 億"
                      if len(diff_matches) > 1:
                          margin_sell = f"{diff_matches[1]} 張"

              margin_json = [{
                  '融資餘額(張)': margin_buy,
                  '融券餘額(張)': margin_sell
              }]

              with open('data/margin.json', 'w', encoding='utf-8') as f:
                  json.dump(margin_json, f, ensure_ascii=False, indent=2)
              print("✅ Margin data updated successfully:", margin_json)

          except Exception as e:
              print("❌ Scrape Margin error:", e)

          # 2. 爬取 Yahoo 奇摩股市 - 三大法人籌碼
          try:
              print("Scraping Yahoo Institutional Investors Page...")
              url_inst = "https://tw.stock.yahoo.com/institutional-investors"
              r = requests.get(url_inst, headers=headers, timeout=15)
              soup = BeautifulSoup(r.text, 'html.parser')
              text_content = soup.get_text()

              net_match = re.search(r'(?:買賣超|合計)[^\d\-+]*([\-+]?[\d,]+(?:\.\d+)?)\s*(?:億|萬)?', text_content)
              total_net = "0"
              if net_match:
                  total_net = net_match.group(1).replace(',', '')

              fund_json = [{'買賣差額': total_net}]

              with open('data/fund.json', 'w', encoding='utf-8') as f:
                  json.dump(fund_json, f, ensure_ascii=False, indent=2)
              print("✅ Fund data updated:", fund_json)
          except Exception as e:
              print("❌ Scrape Fund error:", e)

          # 3. 抓取美股四大指數
          try:
              print("Fetching US Stock Indices...")
              us_symbols = [
                  ("usDJI", "^DJI"),
                  ("usIXIC", "^IXIC"),
                  ("usGSPC", "^GSPC"),
                  ("usSOX", "^SOX")
              ]
              us_data = {}

              for key, symbol in us_symbols:
                  try:
                      api_url = f"https://query2.finance.yahoo.com/v8/finance/chart/{symbol}?interval=1d&range=1d"
                      res = requests.get(api_url, headers=headers, timeout=10)
                      data = res.json()
                      meta = data['chart']['result'][0]['meta']
                      price = meta.get('regularMarketPrice', 0)
                      prev_close = meta.get('chartPreviousClose', meta.get('previousClose', price))
                      change_pct = ((price - prev_close) / prev_close * 100) if prev_close else 0

                      us_data[key] = {
                          "price": f"{price:,.2f}",
                          "change": f"{change_pct:+.2f}%"
                      }
                  except Exception as err:
                      print(f"Error fetching {symbol}:", err)
                      us_data[key] = {"price": "--", "change": "0.00%"}

              with open('data/us_stocks.json', 'w', encoding='utf-8') as f:
                  json.dump(us_data, f, ensure_ascii=False, indent=2)
              print("✅ US Stocks data updated:", us_data)
          except Exception as e:
              print("❌ Scrape US error:", e)

          EOF
          python3 scrape.py

      - name: Commit & Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto update evening stock data via Yahoo scraping" || exit 0
          git push
