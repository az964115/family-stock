<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f0a500">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐷豬豬e網 - 資產管理🐷</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { 
      font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif; 
      margin: 0; 
      padding: 20px; 
      max-width: 900px; 
      background-color: #fdf6e3; 
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #333; 
      transition: background 0.5s ease;
      line-height: 1.5;
    }
    /* 玻璃擬態優化 */
    .container { 
      background: rgba(255, 255, 255, 0.85); 
      backdrop-filter: blur(10px); 
      border-radius: 16px; 
      padding: 24px; 
      margin-bottom: 25px; 
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); 
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
    .stat-box { 
      background: rgba(255, 255, 255, 0.6); 
      padding: 15px; 
      border-radius: 12px; 
      text-align: center; 
      border: 1px solid rgba(240, 165, 0, 0.2); 
    }
    input, button { padding: 10px 16px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; outline: none; }
    button { 
      cursor: pointer; 
      background-color: #f0a500; 
      color: #fff; 
      border: none; 
      font-weight: 600;
      transition: all 0.2s;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    .chart-container { height: 300px; margin-top: 20px; }
    
    #portfolioList { list-style: none; padding: 0; }
    .stock-item { 
      background: rgba(255, 255, 255, 0.9); 
      padding: 18px; 
      border-radius: 12px; 
      margin-bottom: 12px; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.02); 
      border-left: 6px solid #f0a500; 
      transition: transform 0.2s;
    }
    .stock-item:hover { transform: scale(1.01); }
    .stock-info-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .stock-code { font-size: 1.1em; color: #b47700; font-weight: bold; }
    
    /* 損益色彩優化 */
    .profit-positive { color: #d63031; font-weight: bold; } /* 台灣紅 */
    .profit-negative { color: #00b894; font-weight: bold; } /* 台灣綠 */
    .percentage-tag {
        font-size: 0.9em;
        padding: 2px 6px;
        border-radius: 4px;
        margin-left: 4px;
    }
    .tag-pos { background: rgba(214, 48, 49, 0.1); }
    .tag-neg { background: rgba(0, 184, 148, 0.1); }

    /* 開關樣式 */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; vertical-align: middle; margin: 0 10px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #f0a500; }
    input:checked + .slider:before { transform: translateX(20px); }

    .calc-btn { background-color: #0984e3; }
    .bg-upload-btn { background-color: #636e72; }

    /* Modal */
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); }
    .modal-content { 
      background: #fff; margin: 10% auto; padding: 30px; border-radius: 20px; width: 90%; max-width: 450px; 
      border: 2px solid #f0a500; box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    .calc-result { background: #fff9f0; padding: 15px; border-radius: 12px; margin-top: 15px; border: 1px dashed #f0a500; display: none; }
  </style>
</head>
<body>

  <div id="loginSection" class="container">
    <h2 style="text-align: center; color: #f0a500;">🔑 帳戶登入</h2>
    <div style="display: flex; flex-direction: column; gap: 10px;">
        <input type="text" id="loginUser" placeholder="請輸入帳號">
        <input type="password" id="loginPassword" placeholder="請輸入密碼">
        <button onclick="login()" style="font-size: 1.1em; padding: 12px;">確認登入</button>
    </div>
  </div>

  <div id="mainContent" style="display:none;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
      <div>
        <h2 id="userNameDisplay" style="display: inline-block; margin-right: 15px;">Hi, User</h2>
        <button class="bg-upload-btn" onclick="document.getElementById('bgInput').click()">🖼️ 背景</button>
        <button class="calc-btn" onclick="openWithdrawModal()">💰 提領試算</button>
        <input type="file" id="bgInput" hidden accept="image/*" onchange="updateBackground(this)">
      </div>
      <button onclick="logout()" style="background-color: #b2bec3;">登出</button>
    </div>

    <div id="withdrawModal" class="modal">
      <div class="modal-content">
        <h3 style="margin-top:0; color:#b47700;">💸 提領損益結算</h3>
        <p>當前總現值：<b id="modalCurrentValue">$0</b></p>
        <p>當前總損益：<b id="modalTotalProfit">$0</b></p>
        <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
        <label>欲提領金額：</label>
        <input type="number" id="withdrawAmount" style="width:100%; box-sizing: border-box; font-size:1.1em;" placeholder="輸入金額">
        <button onclick="calculateWithdraw()" style="width:100%; margin-top:15px; background-color:#2d3436;">計算 15% 規費</button>
        <div id="calcResult" class="calc-result"><span id="calcDetails"></span></div>
        <button onclick="closeWithdrawModal()" style="width:100%; margin-top:10px; background-color:#aaa; font-size: 0.9em;">關閉</button>
      </div>
    </div>

    <div id="adminPanel" class="container" style="display:none; border: 2px solid #f0a500;">
      <h3>⚙️ 管理權限</h3>
      <div style="display: flex; align-items: center;">
        <span>開放詳細持股清單：</span>
        <label class="switch">
          <input type="checkbox" id="toggleShowAll" onchange="toggleGlobalPermission(this.checked)">
          <span class="slider"></span>
        </label>
        <b id="permissionStatus">讀取中...</b>
      </div>
    </div>

    <div class="container">
      <h3>📈 資產概覽</h3>
      <div class="stat-grid">
        <div class="stat-box">
          <small style="color:#636e72">今日損益變動</small>
          <div id="profitDiffDisplay" style="font-size: 1.6em; font-weight: bold;">--</div>
        </div>
        <div class="stat-box">
          <small style="color:#636e72">帳戶總累積盈餘</small>
          <div id="autoTotalNetWorth" style="font-size: 1.6em; font-weight: bold; color: #0984e3;">計算中...</div>
        </div>
      </div>
      <div class="chart-container"><canvas id="profitTrendChart"></canvas></div>
    </div>

    <div class="container">
      <h3>📋 詳細持股清單</h3>
      <ul id="portfolioList"><li>正在抓取最新市場報價...</li></ul>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCGSq-8joudLdCEB954krl3diNqMQXmsxg",
      authDomain: "piggynet-93c33.firebaseapp.com",
      databaseURL: "https://piggynet-93c33-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "piggynet-93c33",
      storageBucket: "piggynet-93c33.appspot.com",
      messagingSenderId: "65171780729",
      appId: "1:65171780729:web:ce5f7272f25a75f43490a8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let profitChartInstance = null;
    let lastRecordedProfit = 0; 
    let currentGlobalTotalValue = 0;
    let currentGlobalTotalProfit = 0;

    function openWithdrawModal() {
      document.getElementById('modalCurrentValue').textContent = `$${currentGlobalTotalValue.toLocaleString()}`;
      document.getElementById('modalTotalProfit').textContent = `$${currentGlobalTotalProfit.toLocaleString()}`;
      document.getElementById('withdrawModal').style.display = 'block';
    }
    function closeWithdrawModal() { document.getElementById('withdrawModal').style.display = 'none'; }
    function calculateWithdraw() {
      const amount = parseFloat(document.getElementById('withdrawAmount').value);
      if(!amount || amount <= 0) return alert("請輸入有效金額");
      const ratio = Math.round((amount / currentGlobalTotalValue) * 1000) / 1000;
      const allocatedProfit = currentGlobalTotalProfit * ratio;
      const fee = allocatedProfit > 0 ? Math.round(allocatedProfit * 0.15) : 0;
      document.getElementById('calcDetails').innerHTML = `
        提領佔比：${(ratio * 100).toFixed(1)}%<br>
        分攤獲利：$${Math.round(allocatedProfit).toLocaleString()}<br>
        <b>技術服務規費 (15%)：$${fee.toLocaleString()}</b>
      `;
      document.getElementById('calcResult').style.display = 'block';
    }

    function updateBackground(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          const user = localStorage.getItem('currentUser');
          document.body.style.backgroundImage = `url(${e.target.result})`;
          localStorage.setItem(`bg_${user}`, e.target.result);
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function login() {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();
      const snap = await db.ref(`users/${user}/password`).get();
      const stored = snap.exists() ? snap.val() : "9527";
      if (pass === stored) { localStorage.setItem('currentUser', user); location.reload(); }
      else { alert("密碼錯誤"); }
    }
    function logout() { localStorage.removeItem('currentUser'); location.reload(); }

    function toggleGlobalPermission(isOpen) { db.ref('settings/global/showPortfolioToAll').set(isOpen); }

    function loadPortfolio(user) {
      const isJason = user.toLowerCase() === 'jason';
      db.ref('settings/global/showPortfolioToAll').on('value', snap => {
        const globalPerm = snap.val() || false;
        document.getElementById("permissionStatus").textContent = globalPerm ? "已開放全體" : "僅限管理員";
        if(isJason) document.getElementById("toggleShowAll").checked = globalPerm;
        db.ref(`users/${user}/portfolio`).on("value", pfSnap => {
          renderPortfolio(pfSnap.val(), isJason || globalPerm, user);
        });
      });
    }

    async function renderPortfolio(data, hasAccess, user) {
      const listEl = document.getElementById("portfolioList");
      if (!data) { listEl.innerHTML = "<li>無持股資料</li>"; return; }

      let tProfit = 0, tValue = 0;
      let html = "";
      
      for (const code in data) {
        const info = data[code];
        let price = info.cost;
        try {
          const res = await fetch(`https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&stockNo=${code}`);
          const s = await res.json();
          if (s.stat === "OK") price = parseFloat(s.data[s.data.length - 1][6].replace(/,/g, ''));
        } catch(e){}

        const costTotal = info.cost * info.shares;
        const currentTotal = price * info.shares;
        const profit = currentTotal - costTotal;
        const pRate = ((profit / costTotal) * 100).toFixed(2);
        
        tProfit += profit;
        tValue += currentTotal;
        
        const pClass = profit >= 0 ? "profit-positive" : "profit-negative";
        const tagClass = profit >= 0 ? "tag-pos" : "tag-neg";

        html += `
          <li class="stock-item">
            <div class="stock-info-row">
              <span class="stock-code">${hasAccess ? code : '投資項目'}</span>
              <span class="${pClass}">
                ${profit >= 0 ? '+' : ''}${Math.round(profit).toLocaleString()}
                <span class="percentage-tag ${tagClass}">${profit >= 0 ? '+' : ''}${pRate}%</span>
              </span>
            </div>
            <div class="stock-info-row" style="font-size:0.9em; color:#636e72; margin-top:8px;">
              <span>股數: ${hasAccess ? info.shares.toLocaleString() : '****'}</span>
              <span>現值: $${Math.round(currentTotal).toLocaleString()}</span>
            </div>
          </li>`;
      }
      listEl.innerHTML = html;
      currentGlobalTotalProfit = Math.round(tProfit);
      currentGlobalTotalValue = Math.round(tValue);
      document.getElementById("autoTotalNetWorth").textContent = currentGlobalTotalProfit.toLocaleString();
      updateDiff(currentGlobalTotalProfit);
      autoSave(user, currentGlobalTotalProfit);
    }

    function updateDiff(current) {
      const el = document.getElementById("profitDiffDisplay");
      const d = current - lastRecordedProfit;
      el.textContent = `${d >= 0 ? '+' : ''}${d.toLocaleString()}`;
      el.className = d >= 0 ? "profit-positive" : "profit-negative";
    }

    function autoSave(u, p) {
      const d = new Date().toISOString().split('T')[0];
      db.ref(`family/investSnapshot/${u}/${d}`).set({ profit: p });
    }

    window.onload = () => {
      const user = localStorage.getItem('currentUser');
      if (user) {
        const bg = localStorage.getItem(`bg_${user}`);
        if(bg) document.body.style.backgroundImage = `url(${bg})`;
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        document.getElementById('userNameDisplay').textContent = `Hi, ${user}`;
        if (user.toLowerCase() === 'jason') document.getElementById('adminPanel').style.display = 'block';

        db.ref(`family/investSnapshot/${user}`).on("value", snap => {
          const entries = Object.entries(snap.val() || {}).map(([d, v]) => ({ date: d, profit: v.profit })).sort((a,b)=>new Date(a.date)-new Date(b.date));
          if(entries.length > 1) lastRecordedProfit = entries[entries.length - 2].profit;
          
          const ctx = document.getElementById('profitTrendChart').getContext('2d');
          if (profitChartInstance) profitChartInstance.destroy();
          profitChartInstance = new Chart(ctx, {
            type: 'line',
            data: {
              labels: entries.slice(-15).map(e => e.date.slice(5)),
              datasets: [{ label: '盈餘', data: entries.slice(-15).map(e => e.profit), borderColor: '#f0a500', fill: false }]
            },
            options: { responsive: true, maintainAspectRatio: false }
          });
        });
        loadPortfolio(user);
      }
    };
  </script>
</body>
</html>
