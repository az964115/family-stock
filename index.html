<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f0a500">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐷豬豬e網 - 資產管理🐷</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; max-width: 900px; background-color: #fdf6e3; color: #333; }
    .container { background: #fff3e0; border-radius: 10px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 8px rgb(0 0 0 / 0.1); }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
    .stat-box { background: #fff; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #ffe0b2; }
    input, button { padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; }
    button { cursor: pointer; background-color: #f0a500; color: #fff; border: none; font-weight: bold; }
    .chart-container { height: 300px; margin-top: 20px; }
    .stock-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px dotted #ccc; background: #fff; margin-bottom: 5px; border-radius: 5px; }
  </style>
</head>
<body>

  <div id="loginSection" class="container">
    <h2>🔑 登入系統</h2>
    <input type="text" id="loginUser" placeholder="帳號">
    <input type="password" id="loginPassword" placeholder="密碼">
    <button onclick="login()">登入</button>
  </div>

  <div id="mainContent" style="display:none;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
      <h2 id="userNameDisplay">Hi, User</h2>
      <button onclick="logout()" style="background-color: #777;">登出</button>
    </div>

    <div class="container">
      <h3>📈 資產趨勢回顧</h3>
      <div class="stat-grid">
        <div class="stat-box">
          <small>最後紀錄盈餘</small>
          <div id="currentProfitDisplay" style="font-size: 1.5em; font-weight: bold; color: #f0a500;">0</div>
        </div>
        <div class="stat-box">
          <small>今日自動計算損益</small>
          <div id="autoTotalNetWorth" style="font-size: 1.5em; font-weight: bold; color: #2980b9;">計算中...</div>
        </div>
        <div class="stat-box"><small>🚀 今年賺最多</small><div id="maxGainDay">--</div></div>
        <div class="stat-box"><small>📉 今年最慘日</small><div id="maxLossDay">--</div></div>
      </div>
      <div class="chart-container"><canvas id="profitTrendChart"></canvas></div>
    </div>

    <div class="container">
      <h3>📝 手動紀錄/校對</h3>
      <input type="date" id="dateInput">
      <input type="number" id="profitInput">
      <button onclick="saveDailyProfit()">手動更新紀錄</button>
      <p style="color: gray; font-size: 0.8em;">* 網頁載入時會自動抓取股價並嘗試更新今日紀錄</p>
    </div>

    <div class="container">
      <h3>📋 持股列表</h3>
      <ul id="portfolioList"><li>載入中...</li></ul>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCGSq-8joudLdCEB954krl3diNqMQXmsxg",
      authDomain: "piggynet-93c33.firebaseapp.com",
      databaseURL: "https://piggynet-93c33-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "piggynet-93c33",
      storageBucket: "piggynet-93c33.appspot.com",
      messagingSenderId: "65171780729",
      appId: "1:65171780729:web:ce5f7272f25a75f43490a8"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let profitChartInstance = null;

    async function login() {
      const user = document.getElementById('loginUser').value;
      const pass = document.getElementById('loginPassword').value.trim();
      const snap = await db.ref(`users/${user}/password`).get();
      const stored = snap.exists() ? snap.val() : "9527";
      if (pass === stored) { localStorage.setItem('currentUser', user); location.reload(); }
      else { alert("密碼錯誤"); }
    }

    function logout() { localStorage.removeItem('currentUser'); location.reload(); }

    function loadPortfolioAndAutoFill(user) {
      const pfRef = db.ref(`users/${user}/portfolio`);
      const listEl = document.getElementById("portfolioList");
      const profitInput = document.getElementById("profitInput");
      const autoTotalNetWorthEl = document.getElementById("autoTotalNetWorth");

      pfRef.on("value", async (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        let totalProfit = 0;
        let htmlContent = "";
        const stockCodes = Object.keys(data);

        for (const code of stockCodes) {
          const info = data[code];
          let currentPrice = info.cost;
          try {
            const res = await fetch(`https://www.twse.com.tw/exchangeReport/STOCK_DAY?response=json&stockNo=${code}`);
            const stock = await res.json();
            if (stock.stat === "OK" && stock.data && stock.data.length > 0) {
              currentPrice = parseFloat(stock.data[stock.data.length - 1][6].replace(/,/g, ''));
            }
          } catch (e) { console.error(e); }

          const profit = (currentPrice - info.cost) * info.shares;
          totalProfit += profit;
          htmlContent += `<li class="stock-item"><span><b>${code}</b></span><span>${Math.round(profit).toLocaleString()}</span></li>`;
        }

        listEl.innerHTML = htmlContent;
        const finalProfit = Math.round(totalProfit);
        autoTotalNetWorthEl.textContent = finalProfit.toLocaleString();
        profitInput.value = finalProfit;

        // 【新增：自動儲存邏輯】
        autoSaveToHistory(user, finalProfit);
      });
    }

    function autoSaveToHistory(user, profit) {
      const today = new Date().toISOString().split('T')[0];
      const targetRef = db.ref(`family/investSnapshot/${user}/${today}`);
      
      // 先讀取今天的數據，如果數字不一樣才更新，避免無限迴圈
      targetRef.once('value', (snap) => {
        if (!snap.exists() || snap.val().profit !== profit) {
          targetRef.set({ profit: profit }).then(() => {
            console.log("今日數據已自動更新至線圖");
          });
        }
      });
    }

    function loadAnnualReview(user) {
      db.ref(`family/investSnapshot/${user}`).on("value", snap => {
        const val = snap.val() || {};
        const allEntries = Object.entries(val)
          .map(([d, v]) => ({ date: d, profit: v.profit }))
          .sort((a, b) => new Date(a.date) - new Date(b.date));

        if (!allEntries.length) return;
        document.getElementById("currentProfitDisplay").textContent = allEntries[allEntries.length-1].profit.toLocaleString();
        
        const max = allEntries.reduce((p, c) => c.profit > p.profit ? c : p);
        const min = allEntries.reduce((p, c) => c.profit < p.profit ? c : p);
        document.getElementById("maxGainDay").innerHTML = `${max.date}<br><span style="color:red;">$${max.profit.toLocaleString()}</span>`;
        document.getElementById("maxLossDay").innerHTML = `${min.date}<br><span style="color:green;">$${min.profit.toLocaleString()}</span>`;

        renderChart(allEntries.slice(-30));
      });
    }

    function renderChart(entries) {
      const ctx = document.getElementById('profitTrendChart').getContext('2d');
      if (profitChartInstance) profitChartInstance.destroy();
      profitChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: entries.map(e => e.date.substring(5)),
          datasets: [{ label: '個人盈餘趨勢', data: entries.map(e => e.profit), borderColor: '#f0a500', tension: 0.3 }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    function saveDailyProfit() {
      const user = localStorage.getItem('currentUser');
      const date = document.getElementById("dateInput").value;
      const profit = parseFloat(document.getElementById("profitInput").value);
      db.ref(`family/investSnapshot/${user}/${date}`).set({ profit: Math.round(profit) }).then(() => alert("手動更新成功"));
    }

    window.onload = () => {
      const user = localStorage.getItem('currentUser');
      if (user) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        document.getElementById('userNameDisplay').textContent = `Hi, ${user}`;
        document.getElementById("dateInput").value = new Date().toISOString().split('T')[0];
        loadPortfolioAndAutoFill(user);
        loadAnnualReview(user);
      }
    };
  </script>
</body>
</html>
